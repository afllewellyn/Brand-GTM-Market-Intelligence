# Default theme taxonomy — market-agnostic B2B buying signals.
#
# Matching is case-insensitive substring matching against title + snippet.
# Counts produced from this file are the ONLY counts the LLM may cite, so the
# taxonomy is the lens through which the whole run sees the market.
#
# This file is deliberately generic so a fresh clone produces meaningful counts
# for any category. It is a starting point, not a finished taxonomy: a set of
# themes tuned to YOUR market will always read better. Copy this file, edit the
# keywords, and point at it with `themes_file:` in your run config. Stage 5
# warns when fewer than 40% of evidence rows match any theme, which is the
# signal that the taxonomy does not fit the market being searched.

themes:
  pricing_roi:
    - pricing
    - price
    - cost
    - roi
    - return on investment
    - tco
    - payback
    - economics
    - budget
  compliance_security:
    - compliance
    - security
    - privacy
    - gdpr
    - ccpa
    - soc 2
    - hipaa
    - governance
    - data residency
    - risk
    - audit
  performance_validation:
    - performance
    - latency
    - reliability
    - benchmark
    - accuracy
    - uptime
    - case study
    - scale
    - production
    - sla
  implementation:
    - implementation
    - integration
    - api
    - deployment
    - migration
    - architecture
    - onboarding
    - rollout
  comparison:
    - " vs "
    - versus
    - alternative
    - alternatives
    - compare
    - comparison
  vendor_evaluation:
    - rfp
    - rfi
    - shortlist
    - buyer's guide
    - buyers guide
    - evaluation
    - review
    - g2
    - gartner
    - forrester
    - procurement
  adoption_enablement:
